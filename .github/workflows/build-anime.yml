name: Build anime

# Compile uniquement l'app desktop Nartya Anime. Le code source vit dans le repo privé
# `NartyaTeam/nartya`, récupéré via un PAT dédié en lecture seule.
#
# Déclenchement 100% MANUEL, jamais sur `pull_request`. Ce workflow NE PUBLIE RIEN :
# la mise en ligne reste une approbation séparée dans publish-anime.yml.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag desktop NartyaTeam/nartya à compiler (ex. v1.27.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout du code source privé (NartyaTeam/nartya)
        uses: actions/checkout@v4
        with:
          repository: NartyaTeam/nartya
          ref: ${{ inputs.ref }}
          token: ${{ secrets.APP_CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build front (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DISCORD_RPC_CLIENT_ID: "1170085087564541953"

      - name: Build Electron (sans publication)
        run: npx --no-install electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Vérifie la présence des métadonnées updater (latest*.yml)
        shell: bash
        run: |
          if ! ls release/latest*.yml >/dev/null 2>&1; then
            echo "❌ Aucun latest*.yml généré — l'updater standalone serait cassé."
            exit 1
          fi
          ls -lh release/

      - name: Vérifie que latest-mac.yml couvre les deux architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for f in release/latest-mac*.yml; do echo "── $f ──"; cat "$f"; done
          agrege=$(cat release/latest-mac*.yml)
          for a in x64 arm64; do
            printf '%s' "$agrege" | grep -q -- "-mac-${a}\." || {
              echo "❌ Aucun artefact ${a} référencé dans les latest-mac*.yml."
              exit 1
            }
          done
          echo "✅ x64 et arm64 sont tous deux référencés."

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source privé (pour scripts/gen-release-manifest.mjs)
        uses: actions/checkout@v4
        with:
          repository: NartyaTeam/nartya
          ref: ${{ inputs.ref }}
          token: ${{ secrets.APP_CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rassemble les artefacts dans upload/
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp -n {} upload/ \;
          ls -lh upload

      - name: Génère manifest.json + SHA256SUMS.txt
        run: |
          VERSION="${{ inputs.ref }}"
          VERSION="${VERSION#v}"
          node scripts/gen-release-manifest.mjs upload --version "$VERSION"
          ( cd upload && sha256sum Nartya-* > SHA256SUMS.txt )
          cat upload/manifest.json
          cat upload/SHA256SUMS.txt

      - name: Scan des installeurs desktop sur VirusTotal
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            upload/Nartya-*.exe
            upload/Nartya-*.dmg
            upload/Nartya-*.AppImage
            upload/Nartya-*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: dist-final
          path: upload/**
          if-no-files-found: error
          retention-days: 5

      - name: Résumé — prochaine étape
        run: |
          echo "✅ Build desktop terminé pour ${{ inputs.ref }}."
          echo "Run ID : ${GITHUB_RUN_ID}"
          echo "Publication : Actions → Publish anime (manual) → ${GITHUB_RUN_ID}"
