name: Build anime

# Compile uniquement l'app desktop Nartya Anime, depuis le repo public `NartyaTeam/nartya`.
#
# Déclenchement 100% MANUEL, jamais sur `pull_request`. Ce workflow NE PUBLIE RIEN :
# la mise en ligne reste une approbation séparée dans publish-anime.yml.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag desktop NartyaTeam/nartya à compiler (ex. v1.27.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-latest, name: mac-arm64 }
          - { os: macos-15-intel, name: mac-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout du code source (NartyaTeam/nartya, public)
        uses: actions/checkout@v4
        with:
          repository: NartyaTeam/nartya
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build front (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DISCORD_RPC_CLIENT_ID: "1170085087564541953"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Installeur Tauri (sans publication)
        run: npm run tauri:bundle
        env:
          NO_STRIP: "true"

      - name: Contenu produit
        shell: bash
        run: ls -lh release/tauri/

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: |
            release/tauri/*.exe
            release/tauri/*.dmg
            release/tauri/*.AppImage
            release/tauri/*.deb
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source (pour scripts/gen-release-manifest.mjs)
        uses: actions/checkout@v4
        with:
          repository: NartyaTeam/nartya
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rassemble les artefacts dans upload/
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp -n {} upload/ \;
          ls -lh upload

      - name: Génère manifest.json + SHA256SUMS.txt
        run: |
          VERSION="${{ inputs.ref }}"
          VERSION="${VERSION#v}"
          node scripts/gen-release-manifest.mjs upload --version "$VERSION"
          ( cd upload && sha256sum Nartya-* > SHA256SUMS.txt )
          cat upload/manifest.json
          cat upload/SHA256SUMS.txt

      - name: Scan des installeurs desktop sur VirusTotal
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            upload/Nartya-*.exe
            upload/Nartya-*.dmg
            upload/Nartya-*.AppImage
            upload/Nartya-*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: dist-final
          path: upload/**
          if-no-files-found: error
          retention-days: 5

      - name: Résumé — prochaine étape
        run: |
          echo "✅ Build desktop terminé pour ${{ inputs.ref }}."
          echo "Run ID : ${GITHUB_RUN_ID}"
          echo "Publication : Actions → Publish anime (manual) → ${GITHUB_RUN_ID}"
