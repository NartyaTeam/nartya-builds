name: Build TCG

# Compile l'app Nartya TCG — code source dans le repo PRIVÉ `NartyaTeam/nartya-tcg`, lu ici par une
# clé de déploiement en lecture seule propre à ce dépôt (secret `TCG_DEPLOY_KEY`) : le PAT partagé
# `APP_CHECKOUT_TOKEN` n'a pas besoin d'être élargi.
#
# Ce repo (`nartya-builds`) est PUBLIC : minutes Actions illimitées. Seul le workflow YAML et
# les binaires compilés sont publics — jamais le code source.
#
# Déclenchement 100% MANUEL, jamais sur `pull_request` (cf. README § sécurité — un fork
# externe pourrait sinon exécuter ce workflow et exfiltrer les secrets).
#
# Ce workflow NE PUBLIE RIEN sur nartya.app — cf. publish-tcg.yml, déclenché séparément.
#
# Le jeu parle au serveur du TCG : ses adresses (variables de dépôt `TCG_SERVEUR_URL` en wss:// et
# `TCG_SERVEUR_HTTP` en https://) sont gravées dans le build, avec la bêta fermée (`VITE_BETA_FERMEE=1`).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou branche de NartyaTeam/nartya-tcg à compiler (ex. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source privé (NartyaTeam/nartya-tcg)
        uses: actions/checkout@v4
        with:
          repository: NartyaTeam/nartya-tcg
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TCG_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Vérifie les adresses du serveur du jeu
        shell: bash
        env:
          VITE_SERVEUR: ${{ vars.TCG_SERVEUR_URL }}
          VITE_SERVEUR_HTTP: ${{ vars.TCG_SERVEUR_HTTP }}
        run: |
          if [[ ! "$VITE_SERVEUR" =~ ^wss:// ]] || [[ ! "$VITE_SERVEUR_HTTP" =~ ^https:// ]]; then
            echo "❌ Variables de dépôt TCG_SERVEUR_URL (wss://) / TCG_SERVEUR_HTTP (https://) absentes ou invalides."
            echo "   Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Checkout du code source privé (NartyaTeam/nartya-tcg)
        uses: actions/checkout@v4
        with:
          repository: NartyaTeam/nartya-tcg
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TCG_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build du jeu (Vite)
        run: npm run build:jeu
        env:
          # Même base que les autres apps : comptes Nartya (session du hub), profils.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SERVEUR: ${{ vars.TCG_SERVEUR_URL }}
          VITE_SERVEUR_HTTP: ${{ vars.TCG_SERVEUR_HTTP }}
          VITE_BETA_FERMEE: "1"

      - name: Aucun outil de développement dans le build
        shell: bash
        run: |
          for motif in "Test : tous les" "Comparer les voix" "essaiVoeu" "nartya-tcg-jeton" "npm run"; do
            if grep -rq -- "$motif" packages/client/dist; then
              echo "❌ « $motif » trouvé dans le build : un outil de développement partirait en production."
              exit 1
            fi
          done
          echo "✅ Build propre."

      - name: Build Electron (sans publication)
        run: npx --no-install electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Vérifie la présence des métadonnées updater (latest*.yml)
        shell: bash
        run: |
          if ! ls release/latest*.yml >/dev/null 2>&1; then
            echo "❌ Aucun latest*.yml généré — l'updater standalone serait cassé."
            exit 1
          fi
          ls -lh release/

      - name: Vérifie que latest-mac.yml couvre les deux architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for f in release/latest-mac*.yml; do echo "── $f ──"; cat "$f"; done
          agrege=$(cat release/latest-mac*.yml)
          for a in x64 arm64; do
            printf '%s' "$agrege" | grep -q -- "-mac-${a}\." || {
              echo "❌ Aucun artefact ${a} référencé dans les latest-mac*.yml."
              exit 1
            }
          done
          echo "✅ x64 et arm64 sont tous deux référencés."

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source privé (pour outils/gen-release-manifest.mjs et changelog.js)
        uses: actions/checkout@v4
        with:
          repository: NartyaTeam/nartya-tcg
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TCG_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rassemble les artefacts dans upload/
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp -n {} upload/ \;
          ls -lh upload

      - name: Génère manifest.json + SHA256SUMS.txt
        shell: bash
        run: |
          VERSION="${{ inputs.ref }}"
          VERSION="${VERSION#v}"
          node outils/gen-release-manifest.mjs upload --version "$VERSION"
          ( cd upload && sha256sum "Nartya TCG-"* > SHA256SUMS.txt )
          echo "── manifest.json ──"; cat upload/manifest.json
          echo "── SHA256SUMS.txt ──"; cat upload/SHA256SUMS.txt

      - name: Scan des installeurs sur VirusTotal
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            upload/Nartya TCG-*.exe
            upload/Nartya TCG-*.dmg
            upload/Nartya TCG-*.AppImage
            upload/Nartya TCG-*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: dist-final
          path: upload/**
          if-no-files-found: error
          retention-days: 5

      - name: Résumé — prochaine étape
        run: |
          echo "✅ Build + vérification terminés pour ${{ inputs.ref }}."
          echo ""
          echo "Run ID de CE run : ${GITHUB_RUN_ID}"
          echo ""
          echo "Pour publier sur le VPS : Actions → 'Publish TCG (manual)' → Run workflow"
          echo "→ colle ce run_id : ${GITHUB_RUN_ID}"
