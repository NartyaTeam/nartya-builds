name: Publish anime (manual)

# Porte d'approbation desktop. Reprend sans rebuild l'artefact `dist-final` d'un run précis
# de Build anime et le publie sur le feed auto-hébergé.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID du workflow 'Build anime' à publier"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupère les artefacts desktop vérifiés (aucun rebuild)
        uses: actions/download-artifact@v4
        with:
          name: dist-final
          path: upload
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifie le manifeste desktop
        run: |
          set -euo pipefail
          ls -lh upload
          test -s upload/manifest.json
          test -s upload/SHA256SUMS.txt
          node -e "console.log(require('./upload/manifest.json').version)"

      - name: Upload des binaires desktop vers le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "upload/Nartya-*.exe,upload/Nartya-*.dmg,upload/Nartya-*.zip,upload/Nartya-*.AppImage,upload/Nartya-*.deb,upload/*.blockmap"
          target: "/var/www/nartya/dl/anime/"
          strip_components: 1

      - name: Upload des métadonnées desktop
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "upload/latest*.yml,upload/manifest.json,upload/SHA256SUMS.txt"
          target: "/var/www/nartya/dl/anime/"
          strip_components: 1

      # Le miroir `nartya-app` reste gelé depuis le 2026-07-30.
      - name: Résumé
        run: |
          echo "✅ Desktop publié sur https://nartya.app/dl/anime/"
          echo "Vérifie : curl -s https://nartya.app/dl/anime/manifest.json"
