name: Publish movie (manual)

# Déclenchement 100% MANUEL — porte d'approbation pour la mise en ligne sur le feed
# auto-hébergé https://nartya.app/dl/movies/. Aucun push ne lance ce workflow.
#
# Marche à suivre :
#   1. Actions → "Build movie" → Run workflow → indiquer le tag/branche à compiler.
#   2. Vérifier ce run (logs de build, liens VirusTotal) une fois terminé.
#   3. Si tout est bon : Actions → "Publish movie (manual)" → Run workflow → coller le run_id
#      affiché à la fin du job `verify` de l'étape 1.
#   4. Ce workflow reprend TEL QUEL l'artefact `dist-final` de ce run précis (aucun rebuild)
#      et l'envoie sur le VPS.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID du workflow 'Build movie' à publier (affiché dans son dernier step)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupère les artefacts déjà build + vérifiés (aucun rebuild)
        uses: actions/download-artifact@v4
        with:
          name: dist-final
          path: upload
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifie que la version du manifest correspond à l'attendu
        run: |
          echo "Contenu à publier :"
          ls -lh upload
          echo ""
          echo "Version dans manifest.json :"
          node -e "console.log(require('./upload/manifest.json').version)" 2>/dev/null \
            || (grep -m1 '"version"' upload/manifest.json)

      - name: Upload des binaires vers le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "upload/Nartya Movies-*,upload/*.blockmap"
          target: "/var/www/nartya/dl/movies/"
          strip_components: 1

      - name: Upload des métadonnées (bascule atomique)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "upload/latest*.yml,upload/manifest.json,upload/SHA256SUMS.txt"
          target: "/var/www/nartya/dl/movies/"
          strip_components: 1

      - name: Résumé
        run: |
          echo "✅ Publié sur https://nartya.app/dl/movies/"
          echo "Vérifie : curl -s https://nartya.app/dl/movies/manifest.json"
